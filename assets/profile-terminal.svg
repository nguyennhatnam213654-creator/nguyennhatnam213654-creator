<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214" role="img" aria-labelledby="title desc">
  <title id="title">Nam's development workspace</title>
  <desc id="desc">An animated terminal banner for mobile development, web development, and software quality.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#101927"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#5DE1D1"/>
      <stop offset=".53" stop-color="#79B9FF"/>
      <stop offset="1" stop-color="#BF9AFF"/>
    </linearGradient>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8197BC" opacity=".2"/>
    </pattern>
  </defs>
  <style>
    .mono { font-family: ui-monospace, Consolas, monospace; }
    .sans { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .cursor { animation: breathe 3s ease-in-out infinite; }
    .trace { animation: flow 7s linear infinite; }
    @keyframes breathe { 0%, 100% { opacity: .85; } 50% { opacity: .28; } }
    @keyframes flow { to { stroke-dashoffset: -42; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .trace { animation: none; } }
  </style>
  <rect x=".5" y=".5" width="899" height="213" rx="17" fill="url(#panel)" stroke="#304361"/>
  <path d="M1 38h898" stroke="#283954"/>
  <circle cx="22" cy="19" r="4" fill="#F48C9D"/>
  <circle cx="36" cy="19" r="4" fill="#F6CA7F"/>
  <circle cx="50" cy="19" r="4" fill="#5DE1D1"/>
  <text x="73" y="23" class="mono" font-size="12" fill="#B4C5E0">nam@dev ~/portfolio</text>
  <text x="864" y="23" class="mono" font-size="11" text-anchor="end" fill="#9EADD0">DEVELOPER PROFILE</text>
  <rect x="541" y="52" width="341" height="145" rx="12" fill="url(#dots)"/>
  <text x="31" y="78" class="mono" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5DE1D1">$ BUILD / CONNECT / TEST</text>
  <text x="29" y="126" class="sans" font-size="39" font-weight="750" fill="#F0F6FF">Mobile &amp; web development</text>
  <text x="31" y="157" class="sans" font-size="16" fill="#BDCAE3">Flutter · REST APIs · Software quality</text>
  <rect x="31" y="176" width="150" height="3" rx="1.5" fill="url(#accent)"/>
  <rect class="cursor" x="190" y="173" width="7" height="9" rx="1.5" fill="#5DE1D1" opacity=".85"/>
  <g fill="none" stroke="#385373" stroke-width="1.5">
    <path d="M602 80h38q12 0 12 12v23q0 12 12 12h24"/>
    <path d="M602 174h38q12 0 12-12v-23q0-12 12-12h24"/>
    <path d="M743 127h79"/>
  </g>
  <g class="trace" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 32">
    <path d="M602 80h38q12 0 12 12v23q0 12 12 12h24"/>
    <path d="M602 174h38q12 0 12-12v-23q0-12 12-12h24"/>
    <path d="M743 127h79"/>
  </g>
  <g fill="#121F33" stroke="#486287">
    <rect x="550" y="58" width="52" height="44" rx="10"/>
    <rect x="550" y="152" width="52" height="44" rx="10"/>
    <rect x="688" y="97" width="55" height="60" rx="13"/>
    <rect x="822" y="105" width="52" height="44" rx="10"/>
  </g>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m574 74-6 6 6 6m5-12 6 6-6 6" stroke="#5DE1D1"/>
    <path d="M568 168h16v12h-16zm0 3h16" stroke="#79B9FF"/>
    <rect x="706" y="110" width="19" height="34" rx="4" stroke="#D4E5FF"/>
    <path d="M712 115h7m-6 24h5" stroke="#5DE1D1"/>
    <path d="m842 127 4 4 8-8" stroke="#BF9AFF"/>
  </g>
</svg>
